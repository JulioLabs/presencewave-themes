name: Publish theme ZIPs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-and-upload:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package cleaning service themes
        run: |
          mkdir -p dist
          for theme in afterglow citrus-and-co gridline-clean noir-and-neat sunshine-spark; do
            cd cleaning-services
            zip -qr "../dist/${theme}.zip" "$theme"
            cd ..
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
