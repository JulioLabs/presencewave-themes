name: Publish theme ZIPs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-and-upload:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # Every theme in every industry folder becomes <industry>-<theme>.zip. The cleaning themes
      # are also published under their original <theme>.zip names, which older links use.
      - name: Package themes
        run: |
          mkdir -p dist
          for index in */*/index.html; do
            theme_dir="$(dirname "$index")"
            industry="$(dirname "$theme_dir")"
            theme="$(basename "$theme_dir")"
            (cd "$industry" && zip -qr "../dist/${industry}-${theme}.zip" "$theme")
            if [ "$industry" = "cleaning-services" ]; then
              cp "dist/${industry}-${theme}.zip" "dist/${theme}.zip"
            fi
          done
          ls dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
